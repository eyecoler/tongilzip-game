*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{

}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ===== 시작 화면 ===== */
.sign{display:flex;flex-direction:column;align-items:center;margin-top:10px;position:relative}
.sign .face{width:168px;height:168px;border:6px solid var(--beef);box-shadow:0 0 0 4px var(--kraft),0 14px 40px rgba(255,122,26,.35);animation:bob 2.4s ease-in-out infinite}
.plank{
  margin-top:-22px;position:relative;z-index:1;
  background:var(--beef);color:#fff;font-family:var(--display);
  font-size:56px;line-height:1;letter-spacing:.06em;padding:10px 26px 8px;
  border-radius:10px;border:4px solid var(--kraft);
  box-shadow:0 6px 0 #7d1419;transform:rotate(-2deg);
}
.plank small{display:block;font-family:var(--body);font-size:15px;letter-spacing:.3em;text-align:center;color:var(--kraft);margin-top:4px}
.gametitle{font-family:var(--display);font-size:34px;text-align:center;margin:22px 0 4px;color:var(--gold);line-height:1.1}
.rules{text-align:center;margin:0 0 18px;color:var(--kraft);opacity:.9}
.rules b{color:var(--gold);font-weight:normal}
.legend{display:flex;justify-content:center;gap:14px;margin:0 0 20px;font-size:14px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:16px;height:16px;border-radius:5px;display:inline-block}
.btn{
  display:block;width:100%;border:0;border-radius:16px;padding:16px;
  font-family:var(--display);font-size:28px;color:var(--coal);background:var(--gold);
  box-shadow:0 6px 0 #a47a1c;transition:transform .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a47a1c}
.btn.red{background:var(--beef);color:#fff;box-shadow:0 6px 0 #7d1419}
.btn.ghost{background:transparent;color:var(--kraft);box-shadow:none;border:2px solid rgba(234,214,174,.4);font-family:var(--body);font-size:18px;padding:12px}
.row{display:flex;gap:10px;margin-top:12px}
.row .btn{flex:1}
.soundtoggle{position:fixed;top:12px;right:12px;z-index:30;width:44px;height:44px;border-radius:50%;border:2px solid rgba(234,214,174,.35);background:var(--coal2);color:var(--kraft);font-size:20px}

/* 명예의 전당 */
.board{margin-top:22px;background:var(--coal2);border-radius:16px;padding:14px 16px;border:1px solid rgba(234,214,174,.15)}
.board h3{margin:0 0 8px;font-family:var(--display);font-weight:normal;font-size:22px;color:var(--kraft);display:flex;justify-content:space-between;align-items:baseline}
.board h3 em{font-style:normal;font-family:var(--body);font-size:13px;opacity:.6}
.board ol{list-style:none;margin:0;padding:0}
.board li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed rgba(234,214,174,.15)}
.board li:first-child{border-top:0}
.board .rk{width:28px;text-align:center;font-family:var(--display);color:var(--steel)}
.board li:nth-child(1) .rk{color:var(--gold);font-size:20px}
.board .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-family:var(--display);color:var(--gold)}
.board li.me{background:rgba(242,193,78,.12);border-radius:8px;padding-left:4px;padding-right:4px}
.board .empty{opacity:.6;text-align:center;padding:10px 0}

/* ===== 게임 화면 ===== */
.hud{display:flex;align-items:center;gap:12px;position:relative;margin-top:4px;padding-right:54px}
.hud .face{width:64px;height:64px;border:4px solid var(--beef)}
.hud .face.jump{animation:jump .35s}
.hud .face.shake{animation:shake .4s}
.bubble{
  position:absolute;left:76px;top:-6px;z-index:5;background:#fff;color:var(--coal);
  font-family:var(--display);font-size:24px;padding:4px 14px;border-radius:14px;
  opacity:0;transform:scale(.6);transform-origin:left bottom;transition:opacity .12s,transform .12s;pointer-events:none;white-space:nowrap
}
.bubble::before{content:"";position:absolute;left:-8px;bottom:10px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.bubble.show{opacity:1;transform:scale(1)}
.bubble.bad{background:var(--beef);color:#fff}
.bubble.bad::before{border-right-color:var(--beef)}
.stats{margin-left:auto;text-align:right}
.score{font-family:var(--display);font-size:44px;line-height:1;color:var(--gold)}
.combo{font-size:15px;min-height:20px;color:var(--ember)}
.timebar{height:12px;border-radius:6px;background:var(--coal2);margin:14px 0 6px;overflow:hidden;border:1px solid rgba(234,214,174,.2)}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ember),var(--gold));transform-origin:left;transition:background .3s}
.timebar.hurry i{background:var(--beef)}
.timetext{text-align:center;font-size:15px;opacity:.8}

.grillwrap{position:relative;margin:14px auto 0;width:100%;max-width:400px}
.grill{
  position:relative;width:100%;aspect-ratio:1;border-radius:50%;
  background:
    repeating-linear-gradient(90deg,transparent 0 7.5%,rgba(40,40,44,.95) 7.5% 9.5%),

}
.grill::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.25),transparent 60%);animation:flicker 1.6s infinite alternate;pointer-events:none}
.slot{
  position:absolute;width:26%;height:26%;transform:translate(-50%,-50%);

.meat{
  position:absolute;inset:8%;border-radius:38% 30% 42% 34%;

}

  content:"💨";position:absolute;left:50%;top:0;font-size:28px;transform:translateX(-50%);animation:smoke .6s forwards
}

.float{

@keyframes bob{50%{transform:translateY(-6px)}}

<script>
/* ============ 설정 (여기만 바꾸면 됨) ============ */
const CONFIG = {
  GAME_SEC: 30,                    // 게임 시간(초)
  COUPON_SCORE: 200,               // 이 점수 넘으면 쿠폰 화면
  COUPON_TEXT: "사장님 깜짝 서비스", // 쿠폰 혜택 문구 (대권이형이랑 정해서 수정)
  API: "/api/scores"               // Netlify 함수 주소
};

/* ============ 사운드 (BGM + 효과음) ============ */
const Sound = {
  ctx:null, on:true, master:null, bgm:null, timer:null, step:0, next:0, tempo:136, playing:false,
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);
    this.bgm = this.ctx.createGain(); this.bgm.gain.value = 0.32; this.bgm.connect(this.master);
    const len = this.ctx.sampleRate * 0.5;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  },
  resume(){ if(this.ctx && this.ctx.state !== "running") this.ctx.resume(); },
  setOn(v){ this.on = v; if(this.master) this.master.gain.value = v ? 0.9 : 0; },
  f(m){ return 440 * Math.pow(2, (m-69)/12); },
  tone(freq, t, dur, type="square", vol=0.18, dest, slideTo){
    if(!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t+dur+0.03);
  },
  noise(t, dur, vol, dest, freq=7000, q=0.8){
    if(!this.ctx) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const bp = this.ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(bp); bp.connect(g); g.connect(dest || this.master);
    s.start(t); s.stop(t+dur+0.02);
  },
  // 신나는 뽕짝풍 루프
  melody:[72,0,76,0,79,0,76,74, 72,0,74,76,74,0,69,0, 72,0,76,0,79,0,81,79, 76,0,74,0,72,0,79,0,
          81,0,79,0,76,0,79,0, 81,79,76,74,76,0,0,0, 72,0,76,0,79,0,84,0, 81,79,76,74,72,0,0,0],
  bass:[48,55,53,55,48,55,50,55, 53,60,48,55,50,55,48,55],
  startBgm(){
    if(!this.ctx || this.playing) return;
    this.playing = true; this.step = 0; this.next = this.ctx.currentTime + 0.05;
    this.timer = setInterval(() => this.schedule(), 25);
  },
  stopBgm(){ this.playing = false; clearInterval(this.timer); },
  schedule(){
    const sixteenth = 60 / this.tempo / 4;
    while(this.next < this.ctx.currentTime + 0.12){
      const s = this.step, t = this.next;
      const m = this.melody[s % this.melody.length];
      if(m) this.tone(this.f(m), t, sixteenth*1.6, "square", 0.09, this.bgm);
      if(s % 4 === 0) this.tone(this.f(this.bass[(s/4) % this.bass.length]), t, sixteenth*2.2, "triangle", 0.28, this.bgm);
      if(s % 4 === 2){ // 쿵짝의 '짝'
        this.noise(t, 0.08, 0.12, this.bgm, 3000, 0.6);
        const root = this.bass[Math.floor(s/4) % this.bass.length] + 12;
        [0,4,7].forEach(iv => this.tone(this.f(root+iv), t, sixteenth*0.9, "triangle", 0.05, this.bgm));
      }
      if(s % 2 === 1) this.noise(t, 0.03, 0.05, this.bgm, 9000);
      this.step++; this.next += sixteenth;
    }
  },
  good(){ if(!this.ctx) return; const t=this.ctx.currentTime; this.tone(988,t,0.09,"triangle",0.3); this.tone(1480,t+0.07,0.16,"triangle",0.3); },
  perfect(){ if(!this.ctx) return; const t=this.ctx.currentTime; [1047,1319,1568,2093].forEach((f,i)=>this.tone(f,t+i*0.05,0.14,"triangle",0.26)); },
  bad(){ if(!this.ctx) return; const t=this.ctx.currentTime; this.tone(220,t,0.35,"sawtooth",0.2,null,70); },
  raw(){ if(!this.ctx) return; const t=this.ctx.currentTime; this.tone(300,t,0.12,"square",0.14,null,200); },
  sizzle(){ if(!this.ctx) return; this.noise(this.ctx.currentTime, 0.35, 0.07, null, 5000, 0.5); },
  beep(hi){ if(!this.ctx) return; this.tone(hi?1320:660, this.ctx.currentTime, 0.15, "square", 0.2); },
  fanfare(){ if(!this.ctx) return; const t=this.ctx.currentTime; [60,64,67,72].forEach((m,i)=>this.tone(this.f(m),t+i*0.08,0.18,"square",0.18)); },
  jingle(){ if(!this.ctx) return; const t=this.ctx.currentTime; [72,67,64,67,72,76,79].forEach((m,i)=>this.tone(this.f(m),t+i*0.1,0.2,"triangle",0.25)); }
};

/* ============ 사장님 목소리 (휴대폰 음성합성) ============ */
const Voice = {
  files:{}, ko:null, last:0, tts:("speechSynthesis" in window),
  init(){
    if(this.tts){
      const pick = () => { this.ko = speechSynthesis.getVoices().find(v => (v.lang||"").toLowerCase().startsWith("ko")) || null; };
      pick(); speechSynthesis.onvoiceschanged = pick;
    }
  },
  unlock(){ // iOS는 첫 탭에서 한 번 말해둬야 이후에 소리 남
    if(this.tts){ try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }catch(e){} }
  },
  say(key, text, pitch, force){
    if(!Sound.on) return;
    const now = performance.now();
    if(!force && now - this.last < 650) return;
    this.last = now;
    const f = this.files[key];
    if(f){ const c = f.cloneNode(); c.play().catch(()=>{}); return; }
    if(!this.tts) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR"; if(this.ko) u.voice = this.ko;
      u.pitch = pitch; u.rate = 1.2; u.volume = 1;
      speechSynthesis.speak(u);
    }catch(e){}
  }
};

/* ============ 저장소 (온라인 랭킹 + 기기 백업) ============ */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
function localBoard(){
  try{ return JSON.parse(store.get("tongil_local") || "[]"); }catch(e){ return []; }
}
function saveLocal(name, score){
  const list = localBoard(); list.push({name, score, at:Date.now()});
  list.sort((a,b) => b.score - a.score || a.at - b.at);
  store.set("tongil_local", JSON.stringify(list.slice(0,10)));
}
let online = true;
async function fetchBoard(){
  try{
    const r = await fetch(CONFIG.API, {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json(); online = true; return d.top || [];
  }catch(e){ online = false; return localBoard(); }
}
async function postScore(name, score){
  try{
    const r = await fetch(CONFIG.API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name, score})});
    if(!r.ok) throw new Error(r.status);
    online = true; return await r.json();
  }catch(e){
    online = false; saveLocal(name, score);
    const top = localBoard();
    return {top, rank: top.findIndex(x => x.name === name && x.score === score) + 1};
  }
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderBoard(el, list, limit, me){
  const title = online ? "명예의 전당" : "내 폰 기록";
  const sub = online ? "실시간 TOP " + limit : "온라인 연결 안 됨";
  const rows = list.slice(0, limit).map((x,i) => {
    const isMe = me && x.name === me.name && x.score === me.score;
    return `<li class="${isMe ? "me" : ""}"><span class="rk">${i===0 ? "👑" : i+1}</span><span class="nm">${esc(x.name)}</span><span class="sc">${x.score}점</span></li>`;
  }).join("");
  el.innerHTML = `<h3>${title}<em>${sub}</em></h3>` + (rows ? `<ol>${rows}</ol>` : `<div class="empty">아직 기록이 없어요. 첫 번째 주인공이 되어보세요!</div>`);
}

/* ============ 화면 전환 ============ */
const $ = id => document.getElementById(id);
function show(id){ ["start","game","end"].forEach(s => $(s).classList.toggle("hidden", s !== id)); window.scrollTo(0,0); }

/* ============ 게임 ============ */
const grill = $("grill"), wrap = $("grillwrap");
const POS = [[50,50]];
for(let i=0;i<6;i++){ const a = (-90 + i*60) * Math.PI/180; POS.push([50 + 31*Math.cos(a), 50 + 31*Math.sin(a)]); }
const slots = POS.map(([x,y], i) => {
  const b = document.createElement("button");
  b.className = "slot"; b.style.left = x + "%"; b.style.top = y + "%";
  b.setAttribute("aria-label", "불판 " + (i+1) + "번 자리");
  b.innerHTML = '<div class="meat"></div>';
  grill.appendChild(b);
  const s = {el:b, meat:b.firstChild, x, y, on:false, p:0, dur:2.5, burnt:false, removeAt:0};
  b.addEventListener("pointerdown", e => { e.preventDefault(); tap(s); });
  return s;
});

const RAW_END = 0.60, SWEET_A = 0.70, SWEET_B = 0.80, READY_END = 0.88;
const C0 = [210,64,74], C1 = [156,90,52], C2 = [110,59,30], C3 = [36,22,18];
function mix(a,b,t){ return a.map((v,i) => Math.round(v + (b[i]-v)*t)); }
function colorAt(p){
  const c = p < RAW_END ? mix(C0,C1,p/RAW_END) : p < READY_END ? mix(C1,C2,(p-RAW_END)/(READY_END-RAW_END)) : mix(C2,C3,Math.min(1,(p-READY_END)/(1-READY_END)));
  return `rgb(${c.join(",")})`;
}

let G = null;
const bubbleEl = $("bubble"), faceEl = $("hudFace");
let bubbleT = 0;
function talk(text, bad){
  bubbleEl.textContent = text;
  bubbleEl.classList.toggle("bad", !!bad);
  bubbleEl.classList.add("show");
  clearTimeout(bubbleT); bubbleT = setTimeout(() => bubbleEl.classList.remove("show"), 850);
  faceEl.classList.remove("jump","shake"); void faceEl.offsetWidth;
  faceEl.classList.add(bad ? "shake" : "jump");
}
function floatText(s, text, cls){
  const d = document.createElement("div");
  d.className = "float " + cls; d.textContent = text;
  d.style.left = s.x + "%"; d.style.top = s.y + "%";
  wrap.appendChild(d); setTimeout(() => d.remove(), 820);
}
function clearSlot(s){
  s.on = false; s.burnt = false; s.p = 0;
  s.el.className = "slot"; s.meat.style.backgroundColor = ""; s.meat.style.removeProperty("--marks");
}
function spawn(k){
  const empty = slots.filter(s => !s.on);
  if(!empty.length) return;
  const s = empty[Math.floor(Math.random()*empty.length)];
  s.on = true; s.burnt = false; s.p = 0;
  s.dur = (2.8 - 1.1*k) * (0.88 + Math.random()*0.3);
  s.el.className = "slot on";
  Sound.sizzle();
}
function addScore(n){
  G.score = Math.max(0, G.score + n);
  $("score").textContent = G.score;
}
function setCombo(){
  $("combo").textContent = G.combo >= 3 ? `🔥 ${G.combo} 연속!` : "";
}
function tap(s){
  if(!G || !G.running || !s.on || s.burnt) return;
  const p = s.p;
  if(p < RAW_END){
    G.combo = 0; G.raw++; addScore(-3); setCombo();
    floatText(s, "-3", "bad"); talk("아직 안 익었어~", true); Sound.raw();
    clearSlot(s);
    return;
  }
  if(p <= READY_END){
    G.combo++; G.perfects++;
    const sweet = p >= SWEET_A && p <= SWEET_B;
    let pts = sweet ? 15 : 10;
    if(G.combo >= 3) pts += 5;
    addScore(pts); setCombo();
    G.bestCombo = Math.max(G.bestCombo, G.combo);
    floatText(s, (sweet ? "완벽! +" : "+") + pts, "good");
    if(sweet){ Sound.perfect(); talk("완벽해!"); } else { Sound.good(); talk("굿!"); }
    Voice.say("good", "굿!", 1.0);
  }else{
    G.combo = 0; addScore(2); setCombo();
    floatText(s, "+2 살짝 탔네", "bad"); Sound.raw();
  }
  s.el.classList.add("pop"); s.on = false;
  setTimeout(() => { if(!s.on) clearSlot(s); }, 200);
}
function burn(s){
  s.burnt = true; s.el.classList.add("burnt"); s.el.classList.remove("ready");
  s.removeAt = G.elapsed + 0.55;
  G.combo = 0; G.burntCount++; addScore(-5); setCombo();
  floatText(s, "-5", "bad"); talk("아이고!", true); Sound.bad();
  Voice.say("aigo", "아이고!", 0.7, true);
}

function startGame(){
  Sound.init(); Sound.resume(); Voice.unlock();
  G = {score:0, combo:0, bestCombo:0, perfects:0, burntCount:0, raw:0, elapsed:0, spawnT:0, running:false, count:3, countT:0, last:performance.now(), ended:false};
  slots.forEach(clearSlot);
  $("score").textContent = "0"; setCombo();
  $("timefill").style.transform = "scaleX(1)"; $("timebar").classList.remove("hurry");
  $("timetext").textContent = CONFIG.GAME_SEC + "초";
  show("game");
  const cd = $("countdown"); cd.classList.remove("hidden","small"); cd.textContent = "3";
  Sound.beep(false);
  requestAnimationFrame(loop);
}
function loop(now){
  if(!G || G.ended) return;
  const dt = Math.min(0.1, (now - G.last)/1000); G.last = now;
  if(!G.running){
    G.countT += dt;
    if(G.countT >= 0.7){
      G.countT = 0; G.count--;
      const cd = $("countdown");
      if(G.count > 0){ cd.textContent = G.count; Sound.beep(false); }
      else if(G.count === 0){ cd.textContent = "굽기 시작!"; cd.classList.add("small"); Sound.beep(true); Sound.fanfare(); talk("잘 구워봐~"); }
      else { cd.classList.add("hidden"); G.running = true; Sound.tempo = 136; Sound.startBgm(); }
    }
    requestAnimationFrame(loop); return;
  }
  G.elapsed += dt;
  const k = Math.min(1, G.elapsed / CONFIG.GAME_SEC);
  const left = Math.max(0, CONFIG.GAME_SEC - G.elapsed);
  $("timefill").style.transform = `scaleX(${left/CONFIG.GAME_SEC})`;
  $("timetext").textContent = Math.ceil(left) + "초";
  if(left <= 10 && !$("timebar").classList.contains("hurry")){ $("timebar").classList.add("hurry"); Sound.tempo = 164; talk("빨리빨리!"); }

  G.spawnT -= dt;
  if(G.spawnT <= 0){ spawn(k); G.spawnT = 1.0 - 0.55*k; }

  for(const s of slots){
    if(!s.on) continue;
    if(s.burnt){ if(G.elapsed >= s.removeAt) clearSlot(s); continue; }
    s.p += dt / s.dur;
    s.meat.style.backgroundColor = colorAt(Math.min(1, s.p));
    s.meat.style.setProperty("--marks", Math.min(1, s.p/RAW_END).toFixed(2));
    s.el.classList.toggle("ready", s.p >= RAW_END && s.p <= READY_END);
    if(s.p >= 1) burn(s);
  }

  if(left <= 0){ endGame(); return; }
  requestAnimationFrame(loop);
}

function titleFor(sc){
  if(sc >= 300) return "전설의 한우 굽기 마스터";
  if(sc >= CONFIG.COUPON_SCORE) return "통일집 굽기 반장";
  if(sc >= 100) return "집게 좀 잡아본 손님";
  return "불판 견습생";
}
let lastResult = null;
function endGame(){
  G.running = false; G.ended = true;
  Sound.stopBgm(); Sound.jingle();
  slots.forEach(clearSlot);
  const sc = G.score;
  if(sc >= CONFIG.COUPON_SCORE) Voice.say("good", "굿! 최고야!", 1.0, true);
  else Voice.say("aigo", "아이고~ 한 판 더!", 0.7, true);

  setTimeout(() => {
    show("end");
    $("finalScore").textContent = sc;
    $("rankTitle").textContent = titleFor(sc);
    $("detail").textContent = `잘 구운 고기 ${G.perfects}개, 태운 고기 ${G.burntCount}개, 최대 ${G.bestCombo}연속`;
    const today = new Date();
    const ds = `${today.getFullYear()}.${today.getMonth()+1}.${today.getDate()} ${String(today.getHours()).padStart(2,"0")}:${String(today.getMinutes()).padStart(2,"0")}`;
    $("couponBox").innerHTML = sc >= CONFIG.COUPON_SCORE
      ? `<div class="coupon"><strong>🎉 ${esc(CONFIG.COUPON_TEXT)}</strong><p>직원에게 이 화면을 보여주세요</p><p class="date">${ds} 발급 · 1테이블 1회</p></div>`
      : `<div class="nearmiss">${CONFIG.COUPON_SCORE}점 넘으면 <b style="color:var(--gold);font-weight:normal">${esc(CONFIG.COUPON_TEXT)}</b> 쿠폰! 앞으로 ${CONFIG.COUPON_SCORE - sc}점 🔥</div>`;
    $("nameInput").value = store.get("tongil_name") || "";
    $("submitBtn").disabled = false; $("submitBtn").textContent = "기록 올리기";
    $("msg").textContent = "";
    lastResult = {score: sc, submitted:false};
    fetchBoard().then(list => renderBoard($("endBoard"), list, 10));
  }, 700);
}

async function submit(){
  if(!lastResult || lastResult.submitted) return;
  const name = ($("nameInput").value || "").trim().slice(0,8) || "익명손님";
  store.set("tongil_name", name);
  $("submitBtn").disabled = true; $("submitBtn").textContent = "올리는 중";
  const res = await postScore(name, lastResult.score);
  lastResult.submitted = true;
  $("submitBtn").textContent = "등록 완료";
  const r = res.rank || 0;
  $("msg").textContent = r === 1 ? "👑 1등! 명예의 전당 꼭대기에 올랐어요" : r && r <= 10 ? `${r}위로 등록됐어요!` : r ? `${r}위로 등록됐어요. TOP 10까지 한 판 더?` : "기록을 올렸어요";
  renderBoard($("endBoard"), res.top || [], 10, {name, score:lastResult.score});
  fetchBoard().then(list => renderBoard($("startBoard"), list, 5));
}

async function share(){
  const sc = lastResult ? lastResult.score : 0;
  const text = `통일집 한우 굽기 마스터에서 ${sc}점 나왔다! 이거 넘길 수 있음?`;
  const url = location.href.split("#")[0];
  if(navigator.share){ try{ await navigator.share({title:"통일집 한우 굽기 마스터", text, url}); }catch(e){} return; }
  try{ await navigator.clipboard.writeText(text + " " + url); $("msg").textContent = "링크를 복사했어요. 카톡에 붙여넣기 하세요!"; }
  catch(e){ $("msg").textContent = url; }
}

/* ============ 연결 ============ */
$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", startGame);
$("submitBtn").addEventListener("click", submit);
$("nameInput").addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
$("shareBtn").addEventListener("click", share);
$("soundBtn").addEventListener("click", () => {
  Sound.init(); Sound.resume();
  const on = !Sound.on; Sound.setOn(on);
  if(!on && Voice.tts) try{ speechSynthesis.cancel(); }catch(e){}
  $("soundBtn").textContent = on ? "🔊" : "🔇";
  $("soundBtn").setAttribute("aria-label", on ? "소리 끄기" : "소리 켜기");
});
document.addEventListener("visibilitychange", () => {
  if(!Sound.ctx) return;
  if(document.hidden) Sound.ctx.suspend(); else Sound.resume();
});

Voice.init();
fetchBoard().then(list => renderBoard($("startBoard"), list, 5));
</script>
