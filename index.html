/* 헤더 */
.top{display:flex;align-items:center;gap:12px}
.top .face{width:62px;height:62px;border:4px solid var(--beef);box-shadow:0 0 0 3px var(--kraft)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--display);font-weight:normal;font-size:30px;color:#fff;line-height:1.05;letter-spacing:.02em}
.brand small{display:block;font-size:13px;opacity:.7;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfx{width:42px;height:42px;border-radius:50%;border:2px solid rgba(234,214,174,.3);background:var(--coal2);font-size:18px;flex:none}

/* 탭 */
.tabs{display:flex;gap:8px;margin:14px 0 4px}
.tabs button{
  flex:1;padding:12px 6px;border-radius:14px;background:var(--coal2);color:var(--kraft);
  border:2px solid transparent;font-family:var(--display);font-size:17px;line-height:1.25;opacity:.75
}
.tabs button.on{background:var(--beef);color:#fff;border-color:var(--kraft);opacity:1}

.panel{margin-top:14px}
h2.t{font-family:var(--display);font-weight:normal;font-size:30px;color:var(--gold);margin:4px 0 2px;text-align:center}
p.sub{text-align:center;margin:0 0 16px;opacity:.85;font-size:15px}
.btn{display:block;width:100%;border-radius:16px;padding:15px;font-family:var(--display);font-size:25px;color:var(--coal);background:var(--gold);box-shadow:0 5px 0 #a47a1c;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a47a1c}
.btn.red{background:var(--beef);color:#fff;box-shadow:0 5px 0 #7d1419}
.btn.ghost{background:transparent;color:var(--kraft);box-shadow:none;border:2px solid rgba(234,214,174,.35);font-family:var(--body);font-size:17px;padding:12px}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;margin-top:10px}
.row .btn{flex:1}

/* 누가 쏠까 - 설정 */
.seg{display:flex;gap:8px;margin:0 0 14px}
.seg button{flex:1;padding:11px 4px;border-radius:12px;background:var(--coal2);border:2px solid transparent;font-size:16px}
.seg button.on{border-color:var(--gold);color:var(--gold)}
.plist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.prow{display:flex;gap:8px;align-items:center}
.prow .n{width:26px;text-align:center;font-family:var(--display);color:var(--steel)}
.prow input{flex:1;min-width:0;border-radius:12px;border:2px solid rgba(234,214,174,.3);background:var(--coal2);color:var(--kraft);padding:11px 13px;user-select:text;-webkit-user-select:text}
.prow .del{width:40px;height:40px;border-radius:10px;background:var(--coal2);font-size:18px;color:#ff7a7a;flex:none}

/* 컵 무대 */
.stage{position:relative;height:270px;margin:6px 0 10px}
.table{position:absolute;left:0;right:0;bottom:30px;height:26px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#5b3722,#2b1812);filter:blur(1px)}
.cup{position:absolute;bottom:40px;width:84px;height:104px;transition:transform .32s cubic-bezier(.45,.05,.25,1);will-change:transform}
.cup .body{
  position:absolute;inset:0;border-radius:14px 14px 50% 50%/10px 10px 22px 22px;
  background:linear-gradient(170deg,#e9edf1,#9aa3ab 55%,#6e767e);
  box-shadow:inset -10px 0 16px rgba(0,0,0,.25),inset 10px 0 12px rgba(255,255,255,.35),0 8px 16px rgba(0,0,0,.45);
  clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);
  transition:transform .35s
}
.cup .num{position:absolute;left:0;right:0;top:34px;text-align:center;font-family:var(--display);font-size:26px;color:#4a525a}
.cup.lift .body{transform:translateY(-78px) rotate(-6deg)}
.cup .meat{
  position:absolute;left:50%;bottom:4px;width:52px;height:38px;margin-left:-26px;border-radius:44% 36% 40% 48%;
  background:#D2404A;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);opacity:0;transition:opacity .2s
}
.cup .meat::before{content:"";position:absolute;inset:14%;border-radius:inherit;opacity:.6;
  background:radial-gradient(ellipse 32% 9% at 32% 30%,#fff 60%,transparent 62%),radial-gradient(ellipse 24% 8% at 66% 58%,#fff 60%,transparent 62%)}
.cup.show .meat{opacity:1}
.cup.pick{animation:pickbounce .4s}
.cup.dim{opacity:.4}
.turn{text-align:center;font-family:var(--display);font-size:24px;min-height:34px;color:var(--gold)}
.turnsub{text-align:center;font-size:15px;opacity:.75;min-height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.chip{background:var(--coal2);border-radius:999px;padding:5px 13px;font-size:14px;border:1px solid rgba(234,214,174,.2)}
.chip.safe{color:#8de6a6;border-color:rgba(141,230,166,.4)}
.chip.now{background:var(--gold);color:var(--coal);border-color:var(--gold)}

/* 당첨 */

<script>
/* ============ 설정 (여기만 바꾸면 됨) ============ */
const CONFIG = {
  API: "/api/scores",
  PLACE: "https://naver.me/FK5vDwEf",
  COUPON_HITS: 4,                      // 등급 감별사 쿠폰 기준 (5문제 중)
  COUPON_TEXT: "사장님 깜짝 서비스"      // 쿠폰 혜택 문구
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = n => Math.floor(Math.random()*n);

/* ============ 소리 ============ */
const Sound = {
  ctx:null,on:true,master:null,bgm:null,timer:null,step:0,next:0,tempo:150,playing:false,
  init(){
    if(this.ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    this.ctx=new AC();
    this.master=this.ctx.createGain(); this.master.gain.value=.9; this.master.connect(this.ctx.destination);
    this.bgm=this.ctx.createGain(); this.bgm.gain.value=.3; this.bgm.connect(this.master);
    const len=this.ctx.sampleRate*.5; this.nb=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=this.nb.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  },
  resume(){ if(this.ctx&&this.ctx.state!=="running") this.ctx.resume(); },
  setOn(v){ this.on=v; if(this.master) this.master.gain.value=v?.9:0; },
  f(m){ return 440*Math.pow(2,(m-69)/12); },
  tone(fr,t,dur,type="square",vol=.18,dest,slide){
    if(!this.ctx) return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(fr,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+dur+.03);
  },
  noise(t,dur,vol,dest,fr=7000,q=.8){
    if(!this.ctx) return;
    const s=this.ctx.createBufferSource();s.buffer=this.nb;
    const bp=this.ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=fr;bp.Q.value=q;
    const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(bp);bp.connect(g);g.connect(dest||this.master);s.start(t);s.stop(t+dur+.02);
  },
  mel:[72,0,76,0,79,0,76,74, 72,0,74,76,74,0,69,0, 72,0,76,0,79,0,81,79, 76,0,74,0,72,0,79,0],
  bas:[48,55,53,55,48,55,50,55],
  startBgm(){ if(!this.ctx||this.playing) return; this.playing=true;this.step=0;this.next=this.ctx.currentTime+.05;
    this.timer=setInterval(()=>this.sch(),25); },
  stopBgm(){ this.playing=false; clearInterval(this.timer); },
  sch(){
    const s16=60/this.tempo/4;
    while(this.next<this.ctx.currentTime+.12){
      const s=this.step,t=this.next,m=this.mel[s%this.mel.length];
      if(m) this.tone(this.f(m),t,s16*1.6,"square",.09,this.bgm);
      if(s%4===0) this.tone(this.f(this.bas[(s/4)%this.bas.length]),t,s16*2.2,"triangle",.26,this.bgm);
      if(s%4===2) this.noise(t,.08,.11,this.bgm,3000,.6);
      this.step++; this.next+=s16;
    }
  },
  good(){ if(!this.ctx)return; const t=this.ctx.currentTime; this.tone(988,t,.09,"triangle",.3); this.tone(1480,t+.07,.16,"triangle",.3); },
  bad(){ if(!this.ctx)return; this.tone(220,this.ctx.currentTime,.35,"sawtooth",.2,null,70); },
  tick(){ if(!this.ctx)return; this.noise(this.ctx.currentTime,.05,.09,null,2200,.7); },
  lift(){ if(!this.ctx)return; this.tone(500,this.ctx.currentTime,.18,"triangle",.16,null,900); },
  drum(){ if(!this.ctx)return; const t=this.ctx.currentTime; for(let i=0;i<8;i++) this.noise(t+i*.07,.05,.1,null,2500,.6); },
  fanfare(){ if(!this.ctx)return; const t=this.ctx.currentTime; [60,64,67,72,76].forEach((m,i)=>this.tone(this.f(m),t+i*.09,.2,"square",.2)); },
  jingle(){ if(!this.ctx)return; const t=this.ctx.currentTime; [72,67,64,67,72,76,79].forEach((m,i)=>this.tone(this.f(m),t+i*.1,.2,"triangle",.24)); }
};
/* 사장님 목소리 (휴대폰 음성합성) */
const Voice = {
  ko:null, last:0, tts:("speechSynthesis" in window),
  init(){ if(!this.tts) return;
    const pick=()=>{ this.ko=speechSynthesis.getVoices().find(v=>(v.lang||"").toLowerCase().startsWith("ko"))||null; };
    pick(); speechSynthesis.onvoiceschanged=pick; },
  unlock(){ if(this.tts){ try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){} } },
  say(text,pitch,force){
    if(!Sound.on||!this.tts) return;
    const now=performance.now(); if(!force&&now-this.last<700) return; this.last=now;
    try{ speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; if(this.ko)u.voice=this.ko;
      u.pitch=pitch;u.rate=1.15;u.volume=1; speechSynthesis.speak(u);
    }catch(e){}
  }
};

/* ============ 랭킹 저장소 ============ */
const store={ get(k){try{return localStorage.getItem(k)}catch(e){return null}},
              set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let online=true;
function localBoard(){ try{ return JSON.parse(store.get("tongil_grade")||"[]") }catch(e){ return [] } }
function saveLocal(name,score){
  const l=localBoard(); l.push({name,score,at:Date.now()});
  l.sort((a,b)=>b.score-a.score||a.at-b.at); store.set("tongil_grade",JSON.stringify(l.slice(0,10)));
}
async function fetchBoard(){
  try{ const r=await fetch(CONFIG.API+"?game=grade",{cache:"no-store"}); if(!r.ok) throw 0;
       const d=await r.json(); online=true; return d.top||[]; }
  catch(e){ online=false; return localBoard(); }
}
async function postScore(name,score){
  try{ const r=await fetch(CONFIG.API,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name,score,game:"grade"})});
       if(!r.ok) throw 0; online=true; return await r.json(); }
  catch(e){ online=false; saveLocal(name,score); const top=localBoard();
       return {top,rank:top.findIndex(x=>x.name===name&&x.score===score)+1}; }
}
function renderBoard(el,list,limit,me){
  const rows=list.slice(0,limit).map((x,i)=>{
    const isMe=me&&x.name===me.name&&x.score===me.score;
    return `<li class="${isMe?"me":""}"><span class="rk">${i===0?"👑":i+1}</span><span class="nm">${esc(x.name)}</span><span class="sc">${x.score}점</span></li>`;
  }).join("");
  el.innerHTML=`<h3>감별사 명예의 전당<em>${online?"실시간 TOP "+limit:"이 폰 기록"}</em></h3>`+
    (rows?`<ol>${rows}</ol>`:`<div class="empty">아직 기록이 없어요. 첫 번째 감별사가 되어보세요!</div>`);
}

/* ============ 탭 ============ */
function tab(which){
  $("tabA").classList.toggle("on",which==="A");
  $("tabB").classList.toggle("on",which==="B");
  $("panelA").classList.toggle("hidden",which!=="A");
  $("panelB").classList.toggle("hidden",which!=="B");
  Sound.stopBgm(); window.scrollTo(0,0);
}
$("tabA").onclick=()=>tab("A");
$("tabB").onclick=()=>{ tab("B"); drawMeat($("demoCv"),1,7); };

/* ============ 게임 1: 오늘 누가 쏠까? ============ */
let mode="pay";
const plistEl=$("plist");
function pRow(v){
  const i=plistEl.children.length+1;
  const d=document.createElement("div"); d.className="prow";
  d.innerHTML=`<span class="n">${i}</span><input maxlength="6" placeholder="이름 ${i}" value="${esc(v||"")}">
    <button class="del" aria-label="삭제">✕</button>`;
  d.querySelector(".del").onclick=()=>{ if(plistEl.children.length<=2) return; d.remove(); renumber(); };
  plistEl.appendChild(d);
}
function renumber(){ [...plistEl.children].forEach((d,i)=>{ d.querySelector(".n").textContent=i+1;
  d.querySelector("input").placeholder="이름 "+(i+1); }); updateAdd(); }
function updateAdd(){ $("addP").disabled=plistEl.children.length>=4; }
pRow(""); pRow(""); updateAdd();
$("addP").onclick=()=>{ if(plistEl.children.length<4){ pRow(""); renumber(); } };
$("modeSeg").onclick=e=>{ const b=e.target.closest("button"); if(!b) return;
  mode=b.dataset.m; [...$("modeSeg").children].forEach(x=>x.classList.toggle("on",x===b)); };

const PEN=["물 떠오기","고기 굽기 담당","건배사 하기","노래 한 곡","쌈 싸서 먹여주기","설거지... 는 농담"];
let players=[],cups=[],target=0,turnIdx=0,busy=false,penalty="";

function layoutCups(){
  const stage=$("stage"); stage.querySelectorAll(".cup").forEach(c=>c.remove());
  const n=players.length, W=stage.clientWidth||360, cw=n>=4?74:84;
  const gap=(W-cw*n)/(n+1);
  cups=[];
  for(let i=0;i<n;i++){
    const el=document.createElement("button"); el.className="cup"; el.style.width=cw+"px";
    el.setAttribute("aria-label",(i+1)+"번 컵");
    el.innerHTML=`<div class="meat"></div><div class="body"></div><div class="num">${i+1}</div>`;
    stage.appendChild(el);
    const c={el,slot:i,cw,gap};
    el.onclick=()=>pickCup(c);
    cups.push(c);
  }
  place();
}
function place(anim){
  cups.forEach(c=>{
    const x=c.gap+(c.cw+c.gap)*c.slot;
    if(!anim) c.el.style.transition="none";
    c.el.style.transform=`translateX(${x}px)`;
    if(!anim) requestAnimationFrame(()=>c.el.style.transition="");
  });
}
async function shuffle(){
  busy=true; Sound.init(); Sound.resume(); Voice.unlock();
  $("turn").textContent="섞는 중...";
  $("turnsub").textContent="잘 보세요 👀";
  cups.forEach(c=>c.el.classList.remove("lift","show","dim","pick"));
  cups[target].el.classList.add("show");
  await sleep(700);
  cups[target].el.classList.remove("show");
  await sleep(300);
  const rounds=10+players.length*3;
  for(let r=0;r<rounds;r++){
    let a=rnd(cups.length), b=rnd(cups.length);
    while(b===a) b=rnd(cups.length);
    const t=cups[a].slot; cups[a].slot=cups[b].slot; cups[b].slot=t;
    place(true); Sound.tick();
    await sleep(Math.max(120,300-r*8));
  }
  busy=false; turnIdx=0; nextTurn();
}
function nextTurn(){
  const p=players[turnIdx];
  $("turn").textContent=p+"님 차례!";
  $("turnsub").textContent="컵 하나 고르세요";
  renderChips();
}
function renderChips(){
  $("chips").innerHTML=players.map((p,i)=>{
    const cls=i<turnIdx?"chip safe":i===turnIdx?"chip now":"chip";
    return `<span class="${cls}">${esc(p)}${i<turnIdx?" ✓":""}</span>`;
  }).join("");
}
async function pickCup(c){
  if(busy||c.el.classList.contains("lift")) return;
  busy=true;
  c.el.classList.add("pick"); Sound.lift();
  await sleep(220);
  c.el.classList.remove("pick");
  const idx=cups.indexOf(c);
  c.el.classList.add("lift");
  if(idx===target){
    c.el.classList.add("show");
    await sleep(500);
    Sound.drum(); await sleep(650);
    finishA(players[turnIdx]);
    return;
  }
  Sound.good();
  $("turnsub").textContent="휴~ 살았다!";
  await sleep(700);
  turnIdx++;
  if(turnIdx>=players.length-1 || cups.filter(x=>!x.el.classList.contains("lift")).length<=1){
    // 남은 사람 자동 당첨
    const last=players[turnIdx];
    const rest=cups.find(x=>!x.el.classList.contains("lift"));
    if(rest){ rest.el.classList.add("lift","show"); }
    $("turn").textContent=last+"님...";
    $("turnsub").textContent="남은 컵에 한우가!";
    Sound.drum(); await sleep(900);
    finishA(last); return;
  }
  busy=false; nextTurn();
}
function finishA(name){
  busy=false;
  Sound.stopBgm(); Sound.fanfare();
  $("winName").textContent=name+"님";
  if(mode==="pay"){
    $("winWhat").textContent="오늘은 당신이 쏘는 날! 🥩";
    Voice.say(name+"님이 쏘는 날!",1.0,true);
  }else{
    $("winWhat").textContent="벌칙: "+penalty;
    Voice.say("아이고, "+name+"님 걸렸네!",0.75,true);
  }
  $("aPlay").classList.add("hidden"); $("aEnd").classList.remove("hidden");
}
function startA(){
  const names=[...plistEl.querySelectorAll("input")].map((x,i)=>(x.value||"").trim()||("손님"+(i+1)));
  players=names.slice(0,4);
  if(players.length<2) return;
  penalty=PEN[rnd(PEN.length)];
  target=rnd(players.length);
  $("aSetup").classList.add("hidden"); $("aEnd").classList.add("hidden");
  $("aPlay").classList.remove("hidden");
  requestAnimationFrame(()=>{ layoutCups(); Sound.tempo=150; Sound.startBgm(); shuffle(); });
}
$("goShuffle").onclick=startA;
$("aAgain").onclick=()=>{ penalty=PEN[rnd(PEN.length)]; target=rnd(players.length);
  $("aEnd").classList.add("hidden"); $("aPlay").classList.remove("hidden");
  requestAnimationFrame(()=>{ layoutCups(); Sound.startBgm(); shuffle(); }); };
$("aReset").onclick=()=>{ $("aEnd").classList.add("hidden"); $("aSetup").classList.remove("hidden"); };
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ 게임 2: 한우 등급 감별사 ============ */
const GRADES=[
  {n:"1++",specks:1500,rmin:1.6,rmax:5.0,fat:1,fatw:.07,
   d:"눈꽃처럼 가늘고 촘촘한 마블링. 입에서 녹는 식감의 최고 등급."},
  {n:"1+",specks:620,rmin:2.4,rmax:7.5,fat:2,fatw:.11,
   d:"마블링이 고르게 있지만 1++보다 성글어요. 가성비 좋은 구이용 인기 등급."},
  {n:"1등급",specks:210,rmin:3.4,rmax:11,fat:3,fatw:.17,
   d:"마블링이 굵고 듬성듬성해요. 고기 맛이 진해서 양념구이·국거리에 잘 맞아요."}
];
function drawMeat(cv,g,seed){
  const ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
  let s=(seed*9301+49297)%233280; const R=()=>{ s=(s*9301+49297)%233280; return s/233280; };
  const G=GRADES[g];
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#B32B36"); bg.addColorStop(.5,"#99202B"); bg.addColorStop(1,"#7E151E");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // 살결
  for(let i=0;i<200;i++){
    ctx.globalAlpha=.04+R()*.06; ctx.fillStyle=R()>.5?"#D5454F":"#6B0E17";
    ctx.beginPath(); ctx.ellipse(R()*W,R()*H,14+R()*46,3+R()*6,(R()-.5)*.5,0,7); ctx.fill();
  }
  // 굵은 지방 덩어리 (등급 낮을수록 크고 많음)
  for(let i=0;i<G.fat;i++){
    const cx=W*(.15+R()*.7), cy=H*(.18+R()*.64), rw=W*G.fatw*(.5+R()*.6), rh=H*G.fatw*(.30+R()*.35);
    ctx.globalAlpha=.9; ctx.fillStyle="#F7F1E4";
    ctx.beginPath();
    for(let a=0;a<28;a++){
      const th=a/28*Math.PI*2, k=.9+R()*.18;
      const x=cx+Math.cos(th)*rw*k, y=cy+Math.sin(th)*rh*k;
      a?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath(); ctx.fill();
  }
  // 마블링
  for(let i=0;i<G.specks;i++){
    ctx.globalAlpha=.6+R()*.38; ctx.fillStyle="#FCF8EE";
    const rx=G.rmin+R()*(G.rmax-G.rmin), ry=rx*(.28+R()*.3);
    ctx.beginPath(); ctx.ellipse(R()*W,R()*H,rx,ry,(R()-.5)*2.6,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  // 아래 지방층
  const fatH=10+G.fatw*70;
  const fg=ctx.createLinearGradient(0,H-fatH,0,H);
  fg.addColorStop(0,"rgba(247,241,228,.25)"); fg.addColorStop(.45,"#F4ECDC"); fg.addColorStop(1,"#E7DAC2");
  ctx.fillStyle=fg; ctx.fillRect(0,H-fatH,W,fatH);
  const vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.9);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.42)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}
const QN=5;
let qi=0,qScore=0,qList=[],answered=false;
function makeQuiz(){
  qList=[];
  for(let i=0;i<QN;i++) qList.push({g:rnd(3),seed:rnd(9999)+1});
}
function showQ(){
  answered=false;
  const q=qList[qi];
  $("qnum").textContent=`${qi+1} / ${QN} 문제`;
  $("qscore").textContent=qScore+"점";
  drawMeat($("qCv"),q.g,q.seed);
  [...$("choices").children].forEach(b=>{ b.className=""; b.disabled=false; });
  $("verdict").innerHTML="어느 등급일까요?";
  $("nextQ").classList.add("hidden");
}
$("choices").onclick=e=>{
  const b=e.target.closest("button"); if(!b||answered) return;
  answered=true;
  const pick=+b.dataset.g, q=qList[qi], right=pick===q.g;
  [...$("choices").children].forEach(x=>x.disabled=true);
  if(right){ b.classList.add("right"); qScore+=10; Sound.good(); Voice.say("굿!",1.0); }
  else{
    b.classList.add("wrong");
    [...$("choices").children][q.g].classList.add("right");
    Sound.bad(); Voice.say("아이고!",0.75);
  }
  $("qscore").textContent=qScore+"점";
  $("verdict").innerHTML=`<b>정답: ${GRADES[q.g].n}</b> — ${GRADES[q.g].d}`;
  $("nextQ").classList.remove("hidden");
  $("nextQ").textContent = qi>=QN-1 ? "결과 보기 →" : "다음 문제 →";
};
$("nextQ").onclick=()=>{ qi++; if(qi>=QN) endB(); else showQ(); };
$("bGo").onclick=()=>{
  Sound.init(); Sound.resume(); Voice.unlock();
  qi=0;qScore=0;makeQuiz();
  $("bStart").classList.add("hidden"); $("bEnd").classList.add("hidden");
  $("bPlay").classList.remove("hidden"); showQ();
};
$("bAgain").onclick=()=>$("bGo").click();
function titleFor(hits){
  if(hits>=QN) return "한우 감별 끝판왕";
  if(hits>=4) return "통일집 공식 감별사";
  if(hits>=3) return "고기 좀 아는 손님";
  return "오늘 처음 보셨군요";
}
let lastB=null;
function endB(){
  const hits=qScore/10;
  Sound.jingle();
  $("bPlay").classList.add("hidden"); $("bEnd").classList.remove("hidden");
  $("bFinal").textContent=hits+"개";
  $("bTitle").textContent=titleFor(hits);
  const t=new Date();
  const ds=`${t.getFullYear()}.${t.getMonth()+1}.${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;
  $("bCoupon").innerHTML = hits>=CONFIG.COUPON_HITS
    ? `<div class="coupon"><strong>🎉 ${esc(CONFIG.COUPON_TEXT)}</strong><p>직원에게 이 화면을 보여주세요</p><div class="date">${ds} 발급 · 1테이블 1회</div></div>`
    : `<div class="nearmiss">${CONFIG.COUPON_HITS}개 이상 맞히면 <b style="color:var(--gold);font-weight:normal">${esc(CONFIG.COUPON_TEXT)}</b> 쿠폰!</div>`;
  $("bName").value=store.get("tongil_name")||"";
  $("bSubmit").disabled=false; $("bSubmit").textContent="기록 올리기"; $("bMsg").textContent="";
  lastB={score:qScore,submitted:false};
  fetchBoard().then(l=>renderBoard($("bBoard2"),l,10));
  window.scrollTo(0,0);
}
$("bSubmit").onclick=async()=>{
  if(!lastB||lastB.submitted) return;
  const name=($("bName").value||"").trim().slice(0,8)||"익명손님";
  store.set("tongil_name",name);
  $("bSubmit").disabled=true; $("bSubmit").textContent="올리는 중";
  const res=await postScore(name,lastB.score);
  lastB.submitted=true; $("bSubmit").textContent="등록 완료";
  const r=res.rank||0;
  $("bMsg").textContent = r===1?"👑 1등! 명예의 전당 꼭대기":r&&r<=10?`${r}위로 등록됐어요!`:r?`${r}위예요. 한 판 더?`:"기록을 올렸어요";
  renderBoard($("bBoard2"),res.top||[],10,{name,score:lastB.score});
  fetchBoard().then(l=>renderBoard($("bBoard1"),l,5));
};
$("bName").onkeydown=e=>{ if(e.key==="Enter") $("bSubmit").click(); };
$("bShare").onclick=async()=>{
  const hits=lastB?lastB.score/10:0;
  const text=`통일집 한우 등급 감별사에서 ${QN}개 중 ${hits}개 맞혔다! 너도 해볼래?`;
  const url=location.href.split("#")[0];
  if(navigator.share){ try{ await navigator.share({title:"통일집 게임센터",text,url}); }catch(e){} return; }
  try{ await navigator.clipboard.writeText(text+" "+url); $("bMsg").textContent="링크를 복사했어요. 카톡에 붙여넣기!"; }
  catch(e){ $("bMsg").textContent=url; }
};

/* ============ 공통 ============ */
$("sfxBtn").onclick=()=>{
  Sound.init(); Sound.resume();
  const on=!Sound.on; Sound.setOn(on);
  if(!on&&Voice.tts) try{ speechSynthesis.cancel(); }catch(e){}
  $("sfxBtn").textContent=on?"🔊":"🔇";
  $("sfxBtn").setAttribute("aria-label",on?"소리 끄기":"소리 켜기");
};
document.addEventListener("visibilitychange",()=>{ if(!Sound.ctx)return;
  if(document.hidden) Sound.ctx.suspend(); else Sound.resume(); });
window.addEventListener("resize",()=>{
  if(!cups.length||$("aPlay").classList.contains("hidden")) return;
  const W=$("stage").clientWidth||360,n=players.length,cw=n>=4?74:84,gap=(W-cw*n)/(n+1);
  cups.forEach(c=>{c.cw=cw;c.gap=gap;c.el.style.width=cw+"px";}); place();
});
Voice.init();
drawMeat($("demoCv"),1,7);
fetchBoard().then(l=>renderBoard($("bBoard1"),l,5));
</script>
